name: Project Hub Skell Spacer Real Plugin Verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/builder.py'
      - 'tests/spacer_integration_smoke.py'
      - '.github/workflows/spacer-integration.yml'
  push:
    branches: [main, 'dev/**']
    paths:
      - 'desktop/builder.py'
      - 'tests/spacer_integration_smoke.py'
      - '.github/workflows/spacer-integration.yml'
permissions:
  contents: read
concurrency:
  group: skell-hub-spacer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
jobs:
  build-spacer:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Checkout pinned Skell Spacer
        uses: actions/checkout@v5
        with:
          repository: skellyruno/skell-spacer-vst
          ref: 05373baa6fb87ed870cb572d1fff888b1747daf7
          path: real-spacer
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile genuine Skell Spacer and prove temporary install/rollback
        shell: pwsh
        env:
          SKELL_SPACER_SOURCE: ${{ github.workspace }}/real-spacer
        run: |
          $pinned = (git -C real-spacer rev-parse HEAD).Trim()
          if ($pinned -ne '05373baa6fb87ed870cb572d1fff888b1747daf7') {
            throw "Unexpected Skell Spacer revision: $pinned"
          }
          python -m tests.spacer_integration_smoke
