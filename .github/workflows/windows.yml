name: Windows Project Hub
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install packaging and browser test dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Python syntax and tests
        run: |
          python -m compileall -q desktop tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript syntax
        run: |
          node --check seed.js
          node --check app.js
          node --check desktop_bridge.js
      - name: Generate standalone browser dashboard
        run: python build_standalone.py
      - name: Headless dashboard smoke tests
        run: python tests/smoke_test.py
      - name: Desktop bridge browser integration
        run: python tests/test_desktop_ui.py
      - name: Build Windows desktop app
        run: python -m PyInstaller --clean --noconfirm skell_project_hub.spec
      - name: Executable self-test
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/Skell Project Hub/Skell Project Hub.exe'
          if (-not (Test-Path $exe)) { throw 'Missing Windows executable' }
          # Window-subsystem executables do not reliably set PowerShell's LASTEXITCODE.
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($null -eq $process.ExitCode -or $process.ExitCode -ne 0) {
            throw "Self-test process exited $($process.ExitCode)"
          }
      - name: Verify packaged CLR runtime
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/Skell Project Hub/Skell Project Hub.exe'
          $dll = Join-Path $PWD 'dist/Skell Project Hub/_internal/pythonnet/runtime/Python.Runtime.dll'
          if (-not (Test-Path $dll)) { throw 'Python.Runtime.dll missing' }
          $p = Start-Process -FilePath $exe -ArgumentList '--runtime-probe' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Pythonnet probe failed $($p.ExitCode)" }
      - name: Test downloaded DLL detection and recovery
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/Skell Project Hub/Skell Project Hub.exe'
          $dll = Join-Path $PWD 'dist/Skell Project Hub/_internal/pythonnet/runtime/Python.Runtime.dll'
          try {
            Set-Content -LiteralPath ($dll + ':Zone.Identifier') -Value ("[ZoneTransfer]" + [char]10 + "ZoneId=3")
            $p = Start-Process -FilePath $exe -ArgumentList '--runtime-probe' -Wait -PassThru
            if ($p.ExitCode -eq 0) { throw 'Expected blocked download warning' }
          } finally {
            Unblock-File -LiteralPath $dll
          }
          $p = Start-Process -FilePath $exe -ArgumentList '--runtime-probe' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Runtime did not recover after unblocking' }
      - name: Verify actual native WebView2 window opens
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/Skell Project Hub/Skell Project Hub.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--gui-smoke-test' -PassThru
          if (-not $p.WaitForExit(45000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'GUI smoke test timed out'
          }
          if ($p.ExitCode -ne 0) { throw "GUI smoke test failed $($p.ExitCode)" }
      - name: Package opt-in download repair tool
        shell: pwsh
        run: |
          Copy-Item scripts/Repair-Project-Hub.cmd 'dist/Skell Project Hub/'
          Copy-Item scripts/Repair-Project-Hub.ps1 'dist/Skell Project Hub/'
      # upload-artifact creates the ZIP itself; uploading an existing ZIP
      # causes an annoying and unnecessary double-unzip for Windows users.
      - uses: actions/upload-artifact@v4
        with:
          name: Skell-Project-Hub-Windows-Portable
          path: dist/
          if-no-files-found: error
          retention-days: 14
