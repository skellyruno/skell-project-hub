name: Import Project Hub source (one-time)
on:
  push:
    branches: [dev/windows-desktop-skellworld-v1.3]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand exact verified source package
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import tarfile
          from pathlib import Path

          archive = Path('bootstrap/skell-project-hub-v1.3.tar.gz.b64')
          payload = base64.b64decode(archive.read_text(encoding='ascii'), validate=True)
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as bundle:
              members = bundle.getmembers()
              for m in members:
                  p = Path(m.name)
                  if not m.isfile() or p.is_absolute() or '..' in p.parts:
                      raise ValueError('Unexpected archive entry: ' + m.name)
              bundle.extractall(path='.', filter='data')
          assert Path('desktop/main.py').is_file()
          assert Path('app.js').is_file()
          assert Path('.github/workflows/windows.yml').is_file()
          # The Actions GITHUB_TOKEN cannot add or delete workflow files.
          # A GitHub connector with workflow permission will create windows.yml separately.
          Path('.github/workflows/windows.yml').unlink()
          archive.unlink()
          Path('bootstrap').rmdir()
          print('Imported', len(members), 'reviewable source files')
          PY
      - name: Commit imported source to development branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: import existing Project Hub with Windows desktop and safe SkellWorld discovery'
          git push origin HEAD:dev/windows-desktop-skellworld-v1.3
